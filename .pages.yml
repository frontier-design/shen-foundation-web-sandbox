# Pages CMS config — https://pagescms.org/docs/configuration
media:
  input: public/media
  output: /media
  categories: [image]
  rename: safe

content:
  - name: home
    label: Home
    type: file
    path: content/pages/home.json
    format: json
    operations:
      delete: false
      rename: false
    actions:
      - name: add-video
        label: Add video
        workflow: add-video.yml
        ref: preview
        confirm:
          title: Add a video
          message: "Save your changes first. Paste a Google Drive or Dropbox link to one MP4 (H.264) file under 100 MB (under 20 MB loads more smoothly and also plays on cards), shared with 'Anyone with the link'. It takes about a minute; then reload this page and check Video status."
          button: Add video
        fields:
          - name: spot
            label: Which spot?
            type: select
            required: true
            default: callout
            options:
              - label: "Homepage callout"
                value: callout
          - name: link
            label: Video link (Google Drive or Dropbox)
            type: text
            required: true
    fields:
      - name: heroSlides
        label: Hero carousel
        type: reference
        options:
          collection: exhibitions
          multiple: true
          search: title,subtitle
          label: "{title} — {subtitle}"
      - name: callout
        label: Homepage callout
        type: object
        fields:
          - name: enabled
            label: Show callout
            type: boolean
          - name: feature
            label: Featured item
            type: block
            blockKey: type
            blocks:
              - name: exhibition
                label: Exhibition
                fields:
                  - name: exhibition
                    label: Exhibition
                    type: reference
                    required: true
                    options:
                      collection: exhibitions
                      search: title,subtitle
                      label: "{title} — {subtitle}"
              - name: event
                label: Event
                fields:
                  - name: event
                    label: Event
                    type: reference
                    required: true
                    options:
                      collection: events
                      search: title
                      label: "{title}"
          - name: image
            label: Image (portrait)
            type: image
            required: true
            description: "Portrait only. Landscape images are not accepted here."
            options:
              categories: [image]
              path: public/media
          - name: imageVideo
            label: Video (optional)
            type: string
            description: "Added with \"Add video\" at the top of this page. Clear this field to remove the video."
            pattern:
              regex: '^$|^https://(?:faq0catz0eljtbgc|adcq3xook5cajgm3)\.public\.blob\.vercel-storage\.com/videos/[a-z0-9-]+/\d+x\d+(-\d+)?\.(mp4|webm)$'
              message: "Use \"Add video\" at the top of this page to add a video."
      - name: videoStatus
        label: Video status
        type: text
        readonly: true
        description: "The result of the last \"Add video\". Filled in automatically: reload this page when it has finished."
      - name: grid
        label: Homepage grid
        type: block
        blockKey: type
        list:
          collapsible:
            collapsed: true
            summary: "{exhibition}{event}"
        blocks:
          - name: exhibition
            label: Exhibition
            fields:
              - name: exhibition
                label: Exhibition
                type: reference
                required: true
                options:
                  collection: exhibitions
                  search: title,subtitle
                  value: "{subtitle}"
                  label: "{title} — {subtitle}"
          - name: event
            label: Event
            fields:
              - name: event
                label: Event
                type: reference
                required: true
                options:
                  collection: events
                  search: title
                  value: "{title}"
                  label: "{title}"

  - name: artistsPage
    label: Artists page
    type: file
    path: content/pages/artists.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: artistOrder
        label: Artist order
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{artist}"
        fields:
          - name: artist
            label: Artist
            type: reference
            options:
              collection: artists
              search: title
              value: "{title}"
              label: "{title}"

  - name: aboutPage
    label: About page
    type: file
    path: content/pages/about.json
    format: json
    operations:
      delete: false
      rename: false
    actions:
      - name: add-video
        label: Add video
        workflow: add-video.yml
        ref: preview
        confirm:
          title: Add a video
          message: "Save your changes first. Paste a Google Drive or Dropbox link to one MP4 (H.264) file under 100 MB (under 20 MB loads more smoothly and also plays on cards), shared with 'Anyone with the link'. It takes about a minute; then reload this page and check Video status."
          button: Add video
        fields:
          - name: spot
            label: Which spot?
            type: select
            required: true
            default: hero
            options:
              - label: "Hero"
                value: hero
              - label: "A person's photo"
                value: person
          - name: link
            label: Video link (Google Drive or Dropbox)
            type: text
            required: true
          - name: person
            label: "Person's name (only for a person's photo)"
            type: text
    fields:
      - name: heroImage
        label: Hero image (full bleed)
        type: image
        description: "Fills the top of the page behind the white card."
        options:
          categories: [image]
          path: public/media
      - name: heroVideo
        label: Video (optional)
        type: string
        description: "Added with \"Add video\" at the top of this page. Clear this field to remove the video."
        pattern:
          regex: '^$|^https://(?:faq0catz0eljtbgc|adcq3xook5cajgm3)\.public\.blob\.vercel-storage\.com/videos/[a-z0-9-]+/\d+x\d+(-\d+)?\.(mp4|webm)$'
          message: "Use \"Add video\" at the top of this page to add a video."
      - name: videoStatus
        label: Video status
        type: text
        readonly: true
        description: "The result of the last \"Add video\". Filled in automatically: reload this page when it has finished."
      - name: heroBody
        label: About Us body copy
        type: rich-text
        description: "Shown under the 'About Us' title in the white hero card. Keep it under about 600 characters so it fits the card. Supports bold, italic, links and lists. Headings, quotes, tables and code show as plain text."
        options:
          format: html
          media: false
          switcher: false
      - name: intro
        label: Intro section (under the hero)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
            options:
              maxlength: 80
          - name: body
            label: Body
            type: rich-text
            description: "Shown beside the title. Supports bold, italic, links and lists. Headings, quotes, tables and code show as plain text."
            options:
              format: html
              media: false
              switcher: false
      - name: people
        label: People
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string
            options:
              maxlength: 80
          - name: role
            label: Role
            type: string
            options:
              maxlength: 120
          - name: bio
            label: Bio
            type: rich-text
            description: "Supports bold, italic, links and lists. Headings, quotes, tables and code show as plain text."
            options:
              format: html
              media: false
              switcher: false
          - name: photo
            label: Photo
            type: image
            options:
              categories: [image]
              path: public/media
          - name: photoVideo
            label: Video (optional)
            type: string
            description: "Added with \"Add video\" at the top of this page. Clear this field to remove the video."
            pattern:
              regex: '^$|^https://(?:faq0catz0eljtbgc|adcq3xook5cajgm3)\.public\.blob\.vercel-storage\.com/videos/[a-z0-9-]+/\d+x\d+(-\d+)?\.(mp4|webm)$'
              message: "Use \"Add video\" at the top of this page to add a video."

  - name: artists
    label: Artists
    type: collection
    path: content/artists
    format: json
    filename:
      template: "{fields.title}.json"
      field: false
    view:
      fields: [title]
      primary: title
      sort: [title]
      search: [title]
      default:
        sort: title
        order: asc
    actions:
      - name: add-video
        label: Add video
        workflow: add-video.yml
        ref: preview
        scope: entry
        confirm:
          title: Add a video
          message: "Save your changes first. Paste a Google Drive or Dropbox link to one MP4 (H.264) file under 100 MB (under 20 MB loads more smoothly and also plays on cards), shared with 'Anyone with the link'. It takes about a minute; then reload this page and check Video status."
          button: Add video
        fields:
          - name: spot
            label: Which spot?
            type: select
            required: true
            default: thumbnail
            options:
              - label: "Thumbnail"
                value: thumbnail
          - name: link
            label: Video link (Google Drive or Dropbox)
            type: text
            required: true
    fields:
      - name: title
        label: Artist
        type: string
        required: true
        options:
          maxlength: 80
      - name: bio
        label: Bio
        type: rich-text
        description: "Supports bold, italic, links and lists. Headings, quotes, tables and code show as plain text."
        options:
          format: html
          media: false
          switcher: false
      - name: thumbnail
        label: Thumbnail
        type: image
        options:
          categories: [image]
          path: public/media
      - name: thumbnailVideo
        label: Video (optional)
        type: string
        description: "Added with \"Add video\" at the top of this page. Clear this field to remove the video."
        pattern:
          regex: '^$|^https://(?:faq0catz0eljtbgc|adcq3xook5cajgm3)\.public\.blob\.vercel-storage\.com/videos/[a-z0-9-]+/\d+x\d+(-\d+)?\.(mp4|webm)$'
          message: "Use \"Add video\" at the top of this page to add a video."
      - name: videoStatus
        label: Video status
        type: text
        readonly: true
        description: "The result of the last \"Add video\". Filled in automatically: reload this page when it has finished."

  - name: exhibitions
    label: Exhibitions
    type: collection
    path: content/exhibitions
    format: json
    filename:
      template: "{fields.subtitle}.json"
      field: false
    view:
      fields: [title, subtitle, status]
      primary: title
      sort: [title]
      search: [title, subtitle]
      default:
        sort: title
        order: asc
    actions:
      - name: add-video
        label: Add video
        workflow: add-video.yml
        ref: preview
        scope: entry
        confirm:
          title: Add a video
          message: "Save your changes first. Paste a Google Drive or Dropbox link to one MP4 (H.264) file under 100 MB (under 20 MB loads more smoothly and also plays on cards), shared with 'Anyone with the link'. It takes about a minute; then reload this page and check Video status."
          button: Add video
        fields:
          - name: spot
            label: Which spot?
            type: select
            required: true
            default: hero
            options:
              - label: "Hero (also plays in the homepage carousel)"
                value: hero
              - label: "Add to gallery (at the end; drag it into place in Gallery)"
                value: gallery
          - name: link
            label: Video link (Google Drive or Dropbox)
            type: text
            required: true
          - name: caption
            label: Gallery caption (optional)
            type: text
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: status
        label: Status
        type: select
        default: ongoing
        description: "Controls which tab this appears under on the Exhibitions & Projects page."
        options:
          values: [ongoing, archive]
      - name: subtitle
        label: Artwork
        type: string
        required: true
        description: "The project/exhibition name. Also used to generate the page URL."
        options:
          maxlength: 80
      - name: heroImage
        label: Hero image (landscape)
        type: image
        description: "Landscape only. Also used as the project thumbnail in grids. Portrait images are not accepted."
        options:
          categories: [image]
          path: public/media
      - name: heroVideo
        label: Video (optional)
        type: string
        description: "Added with \"Add video\" at the top of this page (it also plays in the homepage carousel). Clear this field to remove the video."
        pattern:
          regex: '^$|^https://(?:faq0catz0eljtbgc|adcq3xook5cajgm3)\.public\.blob\.vercel-storage\.com/videos/[a-z0-9-]+/\d+x\d+(-\d+)?\.(mp4|webm)$'
          message: "Use \"Add video\" at the top of this page to add a video."
      - name: videoStatus
        label: Video status
        type: text
        readonly: true
        description: "The result of the last \"Add video\". Filled in automatically: reload this page when it has finished."
      - name: startDate
        label: Start date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: End date (optional)
        type: date
        default: ""
        description: "Leave empty for a single-day date."
        options:
          format: yyyy-MM-dd
      - name: captionLocation
        label: Location
        type: string
      - name: body
        label: Body text
        type: rich-text
        description: "Supports bold, italic, links and lists. Headings, quotes, tables and code show as plain text."
        options:
          format: html
          media: false
          switcher: false
      - name: gallery
        label: Gallery
        type: block
        blockKey: type
        list:
          collapsible:
            collapsed: true
            summary: "#{index}"
        blocks:
          - name: image
            label: Image
            fields:
              - name: image
                label: Image
                type: image
                required: true
                description: "Any dimensions."
                options:
                  categories: [image]
                  path: public/media
              - name: caption
                label: Caption
                type: string
          - name: video
            label: Video
            fields:
              - name: video
                label: Video
                type: string
                required: true
                description: "Added with \"Add video\" at the top of this page."
                pattern:
                  regex: '^https://(?:faq0catz0eljtbgc|adcq3xook5cajgm3)\.public\.blob\.vercel-storage\.com/videos/[a-z0-9-]+/\d+x\d+(-\d+)?\.(mp4|webm)$'
                  message: "Use \"Add video\" at the top of this page to add a video."
              - name: poster
                label: Poster image (optional)
                type: image
                description: "Shown before the video starts and for visitors who turn off motion."
                options:
                  categories: [image]
                  path: public/media
              - name: caption
                label: Caption
                type: string

  - name: events
    label: Events
    type: collection
    path: content/events
    format: json
    filename:
      template: "{fields.title}.json"
      field: false
    view:
      fields: [title, captionLabel, status]
      primary: title
      sort: [title]
      search: [title]
      default:
        sort: title
        order: asc
    actions:
      - name: add-video
        label: Add video
        workflow: add-video.yml
        ref: preview
        scope: entry
        confirm:
          title: Add a video
          message: "Save your changes first. Paste a Google Drive or Dropbox link to one MP4 (H.264) file under 100 MB (under 20 MB loads more smoothly and also plays on cards), shared with 'Anyone with the link'. It takes about a minute; then reload this page and check Video status."
          button: Add video
        fields:
          - name: spot
            label: Which spot?
            type: select
            required: true
            default: background
            options:
              - label: "Background video"
                value: background
          - name: link
            label: Video link (Google Drive or Dropbox)
            type: text
            required: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 80
      - name: status
        label: Status
        type: select
        default: ongoing
        description: "Archived events move to the Archive tab on the Events page."
        options:
          values: [ongoing, archive]
      - name: captionLabel
        label: Event Type
        type: string
        description: "e.g. Talk, Workshop, Tour. Becomes a filter tab on the Events page."
      - name: startDate
        label: Start date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: End date (optional)
        type: date
        default: ""
        description: "Leave empty for a single-day date."
        options:
          format: yyyy-MM-dd
      - name: captionLocation
        label: Location
        type: string
      - name: image
        label: Thumbnail image (landscape)
        type: image
        description: "Landscape only. Portrait images are not accepted."
        options:
          categories: [image]
          path: public/media
      - name: imageVideo
        label: Background video (optional)
        type: string
        description: "Added with \"Add video\" at the top of this page. Clear this field to remove the video."
        pattern:
          regex: '^$|^https://(?:faq0catz0eljtbgc|adcq3xook5cajgm3)\.public\.blob\.vercel-storage\.com/videos/[a-z0-9-]+/\d+x\d+(-\d+)?\.(mp4|webm)$'
          message: "Use \"Add video\" at the top of this page to add a video."
      - name: videoStatus
        label: Video status
        type: text
        readonly: true
        description: "The result of the last \"Add video\". Filled in automatically: reload this page when it has finished."
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
            options:
              maxlength: 80
          - name: content
            label: Content
            type: rich-text
            description: "Supports bold, italic, links and lists. Headings, quotes, tables and code show as plain text."
            options:
              format: html
              media: false
              switcher: false

settings:
  content:
    merge: true

actions:
  - name: publish
    label: Publish to live site
    workflow: publish.yml
    ref: current
    confirm:
      title: Publish to live site?
      message: "This makes everything saved in the CMS live, including changes saved by other editors, so make sure it's all ready. The live site updates about a minute later."
      button: Publish
